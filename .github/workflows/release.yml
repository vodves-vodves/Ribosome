name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run zip
      # a draft: the notes are written by hand before publishing
      - run: gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip --draft --title "Ribosome $GITHUB_REF_NAME" --notes ""
        env:
          GH_TOKEN: ${{ github.token }}
