<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- Ribosome: две субъединицы (широкие, плоские — не «голова и туловище») и нить «точки → тире». Векторная версия для 48/128 и UI. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5AC8FA"/>
      <stop offset="1" stop-color="#007AFF"/>
    </linearGradient>
    <linearGradient id="lobe" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.97"/>
      <stop offset="1" stop-color="#D6EBFF" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="12"/></filter>
  </defs>

  <rect width="1024" height="1024" rx="230" fill="url(#tile)"/>

  <!-- мягкая тень под субъединицами -->
  <g filter="url(#soft)" opacity="0.25" fill="#0040A0">
    <ellipse cx="520" cy="720" rx="300" ry="150"/>
    <ellipse cx="516" cy="430" rx="230" ry="120"/>
  </g>

  <!-- малая (верхняя) субъединица: широкий купол с выемкой снизу под нить -->
  <path fill="url(#lobe)" d="M512 290c140 0 240 60 240 140 0 48-40 78-96 92-44 10-86 16-144 16s-100-6-144-16c-56-14-96-44-96-92 0-80 100-140 240-140Z"/>
  <!-- большая (нижняя) субъединица: широкая «фасолина» -->
  <path fill="url(#lobe)" d="M512 560c190 0 310 60 310 150 0 86-120 134-310 134S202 796 202 710c0-90 120-150 310-150Z"/>

  <!-- блики -->
  <ellipse cx="470" cy="330" rx="110" ry="30" fill="url(#shine)" opacity="0.8"/>
  <ellipse cx="440" cy="605" rx="140" ry="34" fill="url(#shine)" opacity="0.7"/>

  <!-- нить: точки → изгиб в щели между субъединицами → тире -->
  <g fill="#FFFFFF">
    <circle cx="112" cy="540" r="11"/><circle cx="160" cy="540" r="11"/><circle cx="208" cy="540" r="11"/><circle cx="256" cy="540" r="11"/>
  </g>
  <path fill="none" stroke="#FFFFFF" stroke-width="20" stroke-linecap="round" d="M296 540h84c48 0 76 20 132 20s84-20 132-20h84"/>
  <g stroke="#FFFFFF" stroke-width="20" stroke-linecap="round">
    <path d="M770 540h40"/><path d="M846 540h44"/>
  </g>
</svg>
