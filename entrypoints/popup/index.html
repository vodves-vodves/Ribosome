<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ribosome</title>
</head>
<body class="rb">
  <div class="rb-popup">
    <header class="rb-ph">
      <img class="logo" src="/icon/48.png" alt="">
      <span class="name">Ribosome</span>
    </header>
    <div class="rb-seg" id="tabs">
      <button class="is-on" data-tab="tr" data-i18n="tabTranslate"></button>
      <button data-tab="set" data-i18n="tabSettings"></button>
    </div>

    <section class="rb-tab is-on" data-tab="tr">
      <div class="rb-langs">
        <label class="rb-pill"><select id="tr-from" data-i18n-label="from"></select><i data-icon="down"></i></label>
        <button class="rb-swap" id="tr-swap" data-i18n-title="swap"><i data-icon="swap"></i></button>
        <label class="rb-pill"><select id="tr-to" data-i18n-label="to"></select><i data-icon="down"></i></label>
      </div>
      <div class="rb-tawrap"><textarea class="rb-ta" id="tr-in" rows="4"></textarea></div>
      <div class="rb-cnt" id="tr-cnt">0 / 5000</div>
      <div class="rb-res">
        <div class="lab" id="tr-lab"></div>
        <div class="rb-bt is-empty" id="tr-out" dir="auto" data-i18n="outputPlaceholder"></div>
        <div class="rb-note" id="tr-note" hidden></div>
        <div class="bar">
          <button class="rb-btn" id="tr-retry" hidden data-i18n="retry"></button>
          <button class="rb-btn rb-copy" id="tr-copy" hidden></button>
        </div>
      </div>
    </section>

    <section class="rb-tab" data-tab="set">
      <div class="rb-set">
        <div class="rb-grp">
          <h4 data-i18n="languages"></h4>
          <div class="box">
            <label class="rb-row"><span data-i18n="targetLang"></span><span class="val"><select data-set="target"></select><i data-icon="right"></i></span></label>
            <label class="rb-row"><span data-i18n="secondaryLang"></span><span class="val"><select data-set="secondary"></select><i data-icon="right"></i></span></label>
            <label class="rb-row"><span data-i18n="sourceLang"></span><span class="val"><select data-set="source"></select><i data-icon="right"></i></span></label>
          </div>
          <p class="note" data-i18n="secondaryNote"></p>
        </div>

        <div class="rb-grp">
          <h4 data-i18n="trigger"></h4>
          <div class="box" id="set-mode" role="radiogroup" data-i18n-label="trigger">
            <button class="rb-row is-pick" data-mode="icon" role="radio"><span data-i18n="modeIcon"></span><i class="ck" data-icon="done"></i></button>
            <button class="rb-row is-pick" data-mode="instant" role="radio"><span data-i18n="modeInstant"></span><i class="ck" data-icon="done"></i></button>
          </div>
          <p class="note" data-i18n="instantNote"></p>
          <div class="box">
            <label class="rb-row"><span data-i18n="inFields"></span><input type="checkbox" class="rb-switch" role="switch" id="set-fields"></label>
          </div>
        </div>

        <div class="rb-grp">
          <h4 data-i18n="provider"></h4>
          <div class="box">
            <label class="rb-row"><span data-i18n="service"></span><span class="val"><select data-set="provider"><option value="google">Google Translate</option></select><i data-icon="right"></i></span></label>
          </div>
          <p class="note" data-i18n="providerNote"></p>
        </div>

        <div class="rb-grp">
          <h4 data-i18n="appearance"></h4>
          <div class="box">
            <div class="rb-row"><span data-i18n="theme"></span>
              <div class="rb-seg sm" id="set-theme">
                <button data-theme="auto" data-i18n="auto"></button>
                <button data-theme="light" data-i18n="light"></button>
                <button data-theme="dark" data-i18n="dark"></button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>

    <footer class="rb-pf"><span id="ver">Ribosome</span><span>Google Translate</span></footer>
  </div>
  <script type="module" src="./main.ts"></script>
</body>
</html>
